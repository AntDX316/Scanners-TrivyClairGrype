name: Security scans
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/cache/restore@v4
        with:
          path: .security-baseline
          key: security-baseline-${{ github.event.repository.default_branch }}-${{ github.run_id }}
          restore-keys: security-baseline-${{ github.event.repository.default_branch }}-
      - name: Scan code, dependencies, licenses and Git history
        shell: bash
        run: |
          args=(--no-browser --output results)
          if [ -f .security-baseline/report.json ]; then
            args+=(--baseline .security-baseline/report.json --fail-on HIGH --only-new)
          fi
          python scan_docker.py . "${args[@]}"
      - name: Save sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            results/combined_report_*.html
            results/combined_report_*.json
            results/combined_report_*.sarif
          retention-days: 14
      - name: Prepare successful default-branch baseline
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          mkdir -p .security-baseline
          cp "$(ls -t results/combined_report_*.json | head -n 1)" .security-baseline/report.json
      - uses: actions/cache/save@v4
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: .security-baseline
          key: security-baseline-${{ github.event.repository.default_branch }}-${{ github.run_id }}
